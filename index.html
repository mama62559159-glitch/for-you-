<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلبي ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* العبارة العلوية */
        .header-text {
            position: absolute;
            top: 40px;
            font-size: 1.5rem;
            color: #ff80bf;
            font-style: italic;
            text-shadow: 0 0 10px #ff3366;
            opacity: 0;
            animation: fadeIn 2s ease forwards 4s;
            z-index: 10;
        }

        /* حاوية الرسم البياني */
        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            z-index: 5;
        }

        /* النص السفلي */
        .footer-text {
            position: absolute;
            bottom: 50px;
            font-size: 2.8rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            opacity: 0;
            animation: fadeIn 2s ease forwards 4.5s;
            z-index: 10;
        }

        /* خلفية النجوم المتلألئة */
        .star {
            position: absolute;
            border-radius: 50%;
            background-color: #ffffff;
            animation: twinkle var(--duration) infinite ease-in-out;
            z-index: 1;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-text">✨ أنت أجمل ما رأت عيني ✨</div>

    <div class="canvas-container">
        <canvas id="heartCanvas" width="600" height="500"></canvas>
    </div>

    <div class="footer-text">قلبي ❤️</div>

            star.style.top = `${Math.random() * 100}vh`;
