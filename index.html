<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلبي يا قلبي ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Tahoma', sans-serif;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
            cursor: pointer;
        }

        /* تصميم القلب المضيء */
        .heart {
            position: relative;
            width: 100px;
            height: 90px;
            animation: heartbeat 1.2s infinite;
            margin: 0 auto 20px auto;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 52px;
            height: 80px;
            border-radius: 50px 50px 0 0;
            background: #ff3366;
            box-shadow: 0 0 25px #ff3366;
        }

        .heart::before {
            left: 50px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        h1 {
            color: #ffffff;
            font-size: 2.5rem;
            text-shadow: 0 0 15px #ff3366, 0 0 30px #ff3366;
            margin: 0;
            letter-spacing: 2px;
        }

        /* قلوب الخلفية المتطايرة */
        .bg-heart {
            position: absolute;
            color: rgba(255, 51, 102, 0.3);
            font-size: 20px;
            animation: floatUp 5s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% { opacity: 0.8; }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="container" onclick="createBurst()">
        <div class="heart"></div>
        <h1>قلبي ❤️</h1>
    </div>

    <script>
        // دالة لإنشاء قلوب متطايرة في الخلفية تلقائياً
        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createBgHeart, 300);

        // دالة تفاعل عند النقر على القلب
        function createBurst() {
            for (let i = 0; i < 15; i++) {
                const burst = document.createElement('div');
                burst.classList.add('bg-heart');
                burst.innerHTML = '💖';
                burst.style.left = (window.innerWidth / 2) + 'px';
                burst.style.top = (window.innerHeight / 2) + 'px';
                
                // حركة عشوائية عند الانفجار
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 150 + 50;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;

                burst.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(burst);

                setTimeout(() => {
                    burst.style.transform = `translate(${targetX}px, ${targetY}px) scale(1.5)`;
                    burst.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    burst.remove();
                }, 800);
            }
        }
    </script>
</body>
</html>
