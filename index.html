<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قلبي يا قلبي ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Tahoma', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* العبارة العلوية */
        .header-text {
            position: absolute;
            top: 40px;
            font-size: 1.5rem;
            color: #ff80bf;
            font-style: italic;
            text-shadow: 0 0 15px #ff3366;
            animation: fadeIn 2s ease forwards 0.5s;
            opacity: 0;
            z-index: 10;
        }

        /* حاوية القلب النابض */
        .heart-container {
            position: relative;
            cursor: pointer;
            animation: heartbeat 1.2s infinite ease-in-out;
            z-index: 10;
        }

        /* تصميم القلب الاحترافي المتحرك */
        .heart {
            position: relative;
            width: 120px;
            height: 110px;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            top: 0;
            width: 62px;
            height: 95px;
            border-radius: 60px 60px 0 0;
            background: linear-gradient(135deg, #ff3366, #ff1a75);
            box-shadow: 0 0 30px #ff3366, 0 0 60px #ff1a75;
        }

        .heart::before {
            left: 60px;
            transform: rotate(-45deg);
            transform-origin: 0 100%;
        }

        .heart::after {
            left: 0;
            transform: rotate(45deg);
            transform-origin: 100% 100%;
        }

        /* حركة النبض الساحرة */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* النص السفلي */
        .footer-text {
            position: absolute;
            bottom: 50px;
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 20px #ff3366, 0 0 40px #ff3366;
            animation: fadeIn 2s ease forwards 1s;
            opacity: 0;
            z-index: 10;
        }

        /* النجوم والقلوب الصغيرة المتطايرة في الخلفية */
        .floating-heart {
            position: absolute;
            color: rgba(255, 51, 102, 0.6);
            font-size: 20px;
            animation: floatUp 4s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% { opacity: 1; }
            100% {
                transform: translateY(-10vh) scale(1.3);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="header-text">✨ أنت أجمل ما رأت عيني ✨</div>

    <!-- القلب النابض في المنتصف -->
    <div class="heart-container" onclick="createBurst()">
        <div class="heart"></div>
    </div>

    <div class="footer-text">قلبي ❤️</div>

    <script>
        // توليد قلوب صغيرة متطايرة باستمرار في الخلفية
        function createBgHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * window.innerWidth + 'px';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 4000);
        }

        setInterval(createBgHeart, 250);

        // تأثير انفجار قلوب عند النقر على القلب الكبير
        function createBurst() {
            for (let i = 0; i < 20; i++) {
                const burst = document.createElement('div');
                burst.classList.add('floating-heart');
                burst.innerHTML = '💖';
                burst.style.left = (window.innerWidth / 2) + 'px';
                burst.style.top = (window.innerHeight / 2) + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 180 + 60;
                const targetX = Math.cos(angle) * distance;
                const targetY = Math.sin(angle) * distance;

                burst.style.transition = 'all 0.8s ease-out';
                document.body.appendChild(burst);

                setTimeout(() => {
                    burst.style.transform = `translate(${targetX}px, ${targetY}px) scale(1.6)`;
                    burst.style.opacity = '0';
                }, 10);

                setTimeout(() => {
                    burst.remove();
                }, 800);
            }
        }
    </script>
</body>
</html>
